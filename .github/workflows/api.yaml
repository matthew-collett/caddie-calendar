name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Create ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > task-definition.json << EOL
          {
            "family": "${{ secrets.PROJECT_NAME }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "taskRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskRole",
            "containerDefinitions": [
              {
                "name": "${{ secrets.PROJECT_NAME }}",
                "image": "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
                "portMappings": [{"containerPort": 8080, "protocol": "tcp"}],
                "essential": true,
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ secrets.PROJECT_NAME }}",
                    "awslogs-region": "${{ secrets.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                },
                "environment": [
                  {"name": "SECRET_KEY", "value": "${{ secrets.SECRET_KEY }}"},
                  {"name": "FERNET_KEY", "value": "${{ secrets.FERNET_KEY }}"},
                  {"name": "CSRF_SCRIPT_NAME", "value": "${{ secrets.CSRF_SCRIPT_NAME }}"},
                  {"name": "SQLALCHEMY_DATABASE_URI", "value": "${{ secrets.SQLALCHEMY_DATABASE_URI }}"},
                  {"name": "CLUB_ID", "value": "${{ secrets.CLUB_ID }}"},
                  {"name": "CLUB_NAME", "value": "${{ secrets.CLUB_NAME }}"},
                  {"name": "COURSE_ID", "value": "${{ secrets.COURSE_ID }}"},
                  {"name": "PROXY_URL", "value": "${{ secrets.PROXY_URL }}"},
                  {"name": "PROXY_LOGIN", "value": "${{ secrets.PROXY_LOGIN }}"},
                  {"name": "PROXY_LOGOUT", "value": "${{ secrets.PROXY_LOGOUT }}"},
                  {"name": "PROXY_SEARCH", "value": "${{ secrets.PROXY_SEARCH }}"},
                  {"name": "PROXY_PEOPLE", "value": "${{ secrets.PROXY_PEOPLE }}"},
                  {"name": "PROXY_RESERVE", "value": "${{ secrets.PROXY_RESERVE }}"},
                  {"name": "PROXY_REFERER", "value": "${{ secrets.PROXY_REFERER }}"},
                  {"name": "SOURCE", "value": "${{ secrets.SOURCE }}"},
                  {"name": "ALLOWED_ORIGINS", "value": "${{ secrets.ALLOWED_ORIGINS }}"},
                  {"name": "TIMEZONE", "value": "${{ secrets.TIMEZONE }}"}
                ]
              }
            ]
          }
          EOL

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ./api/task-definition.json
          service: ${{ secrets.PROJECT_NAME }}
          cluster: ${{ secrets.PROJECT_NAME }}
