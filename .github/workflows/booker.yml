name: booker
on:
  push:
    branches: [main]
    paths:
      - 'booker/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and deploy
        run: |
          mkdir -p booker/build
          cp -r booker/*.py booker/config booker/model booker/services booker/templates booker/utils booker/build/
          pip install -r booker/requirements.txt --target ./booker/build/
          cd booker/build
          zip -r ../src.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name ${{ secrets.FUNCTION_NAME }} \
            --zip-file fileb://booker/src.zip
